[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bowerbird-logseq"
version = "2.2.0"  # lockstep with bowerbird-mcp: set to the release's number when it is cut
description = "Read a Logseq graph with bowerbird-mcp: install it with `pip install 'bowerbird-mcp[logseq]'`, then set `format: logseq` in bower.yaml."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["bowerbird-mcp"]

[project.entry-points."bowerbird.formats"]
logseq = "bowerbird_logseq:register"

[tool.setuptools]
py-modules = ["bowerbird_logseq"]
