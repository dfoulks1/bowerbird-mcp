[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bowerbird-seal-extensions"
version = "2.3.0"  # lockstep with bowerbird-mcp
description = "The optional parts of sealing for bowerbird-mcp: several signers, a quorum and more. Install it with `pip install 'bowerbird-mcp[seal-extensions]'`."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Bowerbird contributors"}]
maintainers = [{email = "dfoulks@voltpop.com"}]
dependencies = ["bowerbird-mcp>=2.3,<3"]

[project.urls]
Homepage = "https://bowerbird.voltpop.com/"
Documentation = "https://bowerbird.voltpop.com/sealing/"
Repository = "https://github.com/dfoulks1/bowerbird-mcp"
Issues = "https://github.com/dfoulks1/bowerbird-mcp/issues"

[project.entry-points."bowerbird.seal"]
seal-extensions = "bowerbird_seal_extensions:register"

[tool.setuptools]
py-modules = ["bowerbird_seal_extensions"]
