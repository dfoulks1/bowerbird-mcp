[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bowerbird-dendron"
version = "2.3.0"  # lockstep with bowerbird-mcp
description = "Read a Dendron workspace with bowerbird-mcp: install it with `pip install 'bowerbird-mcp[dendron]'`, then set `format: dendron` in bower.yaml."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Bowerbird contributors"}]
maintainers = [{email = "dfoulks@voltpop.com"}]
dependencies = ["bowerbird-mcp>=2.3,<3"]

[project.urls]
Homepage = "https://bowerbird.voltpop.com/"
Documentation = "https://bowerbird.voltpop.com/formats/dendron/"
Repository = "https://github.com/dfoulks1/bowerbird-mcp"
Issues = "https://github.com/dfoulks1/bowerbird-mcp/issues"

[project.entry-points."bowerbird.formats"]
dendron = "bowerbird_dendron:register"

[tool.setuptools]
py-modules = ["bowerbird_dendron"]
